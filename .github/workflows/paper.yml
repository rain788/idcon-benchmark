name: build-paper
on:
  push:
    branches: [main, paper-ci]
    paths: ['paper/**', '.github/workflows/paper.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper
          latexmk_use_lualatex: false
      - name: page report
        run: |
          sudo apt-get -qq install -y poppler-utils > /dev/null
          pdfinfo paper/main.pdf | tee paper/build_report.txt
          for p in $(seq 1 $(pdfinfo paper/main.pdf | awk '/Pages/{print $2}')); do echo "page $p: $(pdftotext -f $p -l $p paper/main.pdf - | grep -E -o '^(REFERENCES|References|[0-9]+ [A-Z][A-Za-z ]+)$' | head -5 | tr '\n' '|')"; done | tee -a paper/build_report.txt
      - name: publish pdf to paper-pdf branch
        run: |
          mkdir out && cp paper/main.pdf paper/build_report.txt out/
          cd out && git init -q && git checkout -q -b paper-pdf
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add . && git commit -q -m "PDF for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" paper-pdf
